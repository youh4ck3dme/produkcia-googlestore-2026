name: bizagent
description: AI Business Assistant pre SZČO a malé firmy
publish_to: 'none'
version: 1.1.0+3

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  firebase_storage: ^13.4.3
  firebase_analytics: ^12.4.3
  firebase_performance: ^0.11.4+3
  firebase_crashlytics: ^5.2.4
  cloud_functions: ^6.3.3
  firebase_remote_config: ^6.5.3

  # Supabase (migrácia DB/Auth/Storage z Firebase — Firebase ostáva počas prechodu)
  supabase_flutter: ^2.16.0
  google_sign_in: ^7.2.0
  web: ^1.1.1

  in_app_purchase: ^3.3.0

  # State Management
  flutter_riverpod: ^3.3.2

  # UI
  google_fonts: ^7.0.2
  flutter_svg: ^2.0.9
  lottie: ^3.3.2
  animations: ^2.0.11
  shimmer: ^3.0.0
  
  # Glass Morphism & Effects (New Design)
  glassmorphism: ^3.0.0
  flutter_animate: ^4.0.0
  
  # Sensors (New Design)
  sensors_plus: ^7.1.0
  # Navigation
  go_router: ^17.0.1

  # Utils
  intl: ^0.20.2
  uuid: ^4.2.2
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  permission_handler: ^12.0.1
  path_provider: ^2.1.1
  path: ^1.9.0
  url_launcher: ^6.2.2
  
  # PDF & Print
  pdf: ^3.10.7
  printing: ^5.11.1

  # Camera & ML
  google_mlkit_text_recognition: ^0.15.0
  camera: ^0.12.0+1
  image_picker: ^1.0.5

  # Speech Recognition
  speech_to_text: ^7.0.0

  # Charts
  fl_chart: ^1.1.1
  qr_flutter: ^4.1.0
  barcode_widget: ^2.0.4
  archive: ^4.0.7
  share_plus: ^13.2.0
  receive_sharing_intent: ^1.8.1
  riverpod_annotation: ^4.0.3
  # Add for code generation
  riverpod_generator: ^4.0.4
  build_runner: ^2.15.1
  csv: ^8.0.0
  flutter_local_notifications: ^22.0.1
  timezone: ^0.11.1
  string_similarity: ^2.0.0
  google_generative_ai: ^0.4.7
  base32: ^2.2.0
  lzma: ^1.0.1
  # Offline Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  http: ^1.2.0
  
  # Biometrics
  local_auth: ^3.0.2
  
  tutorial_coach_mark: ^1.3.3
  in_app_review: ^2.0.9
  connectivity_plus: ^7.2.0
  flutter_web_plugins:
    sdk: flutter
  universal_io: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^4.1.1
  firebase_core_platform_interface: ^7.1.0
  mockito: ^5.6.4
  flutter_local_notifications_platform_interface: ^12.0.0
  mocktail: ^1.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/icon/
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf

flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon_1024.png"
    background_color: "#2563EB"
    theme_color: "#2563EB"
  image_path: "assets/icon/app_icon_1024.png"
